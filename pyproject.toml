[project]
name = "nutri-suivi"
version = "0.1.0"
description = "Suivi des apports en minéraux pour éviter les carences"
requires-python = ">=3.11"  # tomllib (lecture de config.toml) est fourni à partir de Python 3.11
dependencies = ["flet==1.0.0"]

[tool.flet]
product = "Nutri-Suivi"
org = "com.example"

[tool.pytest.ini_options]
testpaths = ["tests"]  # `pytest` depuis la racine du projet lance tous les tests de tests/
pythonpath = ["."]     # pour que les tests importent nutrition.py, config.py... sans installation
