femme = [[17, 0], [200, 20]]
grossesse = 0
allaitement = 0

[nutrients.cholesterol]
label = "Cholestérol"
unit = "mg"
group = "À surveiller"
csv_column = "cholesterol_mg"
ciqual = ['^Cholestérol']
