# --- Glucides en détail -----------------------------------------------------
#  Sucres (total) : maximum conseillé par l'ANSES (100 g/j pour un adulte ; l'ANSES compte les
#  sucres hors lactose et galactose, alors que la colonne Ciqual « Sucres » les inclut : le
#  repère est donc un peu sévère pour qui boit beaucoup de lait).
#  Les sucres pris un à un et l'amidon n'ont pas de repère officiel : sans bloc reference.

[nutrients.sucres]
label = "Sucres"
unit = "g"
group = "Glucides en détail"
csv_column = "sucres_g"
ciqual = ['^Sucres \(g']
goal = "max"
[nutrients.sucres.reference]
homme = [[7, 60], [12, 75], [200, 100]]
femme = [[7, 60], [12, 75], [200, 100]]

