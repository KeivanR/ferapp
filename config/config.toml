# ============================================================================
#  Configuration de Nutri-Suivi
# ============================================================================
#  Ce fichier est lu au démarrage de l'app (et par build_foods.py).
#  Une erreur de saisie (clé inconnue, tranches d'âge dans le désordre...) est
#  signalée avec le nom du nutriment concerné : l'app refuse de démarrer plutôt
#  que d'afficher de faux chiffres.
#
#  ATTENTION : les apports de référence ci-dessous sont des ordres de grandeur
#  saisis pour le prototype (inspirés des références EFSA / ANSES). À vérifier
#  avant tout usage réel ; l'app n'est pas un dispositif médical.
# ============================================================================

[app]
title = "Nutri-Suivi"
tagline = "Repère les carences dans ton alimentation."   # affiché sur la page de démarrage
foods_file = "foods.csv"     # base d'aliments (pour 100 g), générée par build_foods.py
suggestions_max = 8          # nombre de suggestions affichées pendant la frappe
splash_seconds = 1.2         # durée d'affichage de la page de démarrage (secondes)
history_years = 5            # accueil : le calendrier permet de remonter jusqu'à ce nombre d'années
weeks_min = 4                # onglet Semaine : semaines consultables au minimum, même sans historique
my_foods_search_min = 6      # onglet Mes aliments : la recherche apparaît à partir de ce nombre d'aliments
# Onglet Comparer : nombre d'aliments comparés en même temps. Chacun prend une couleur de
# [display] chart_colors, dans l'ordre. Au-delà de 4, les barres deviennent difficiles à distinguer.
compare_max_foods = 4
compare_suggestions = 6      # onglet Comparer : nombre de raccourcis « souvent notés » (0 = aucun)

[profile]
default_age = 30
age_min = 1
age_max = 120
# Tranche d'âge où « réglée » est proposé par défaut pour une femme (nouveau profil, ou
# ancien profil enregistré avant l'existence de ce choix) ; hors tranche : « non réglée ».
menstruation_age_range = [12, 50]
# Groupes de nutriments cochés d'office pour un nouveau profil (noms exacts des « group » plus bas).
# Liste vide = tous. Les autres groupes restent à cocher dans le profil, selon ce qu'on veut suivre.
default_groups = ["Minéraux", "Vitamines"]

[display]
# Diamètre des cercles de complétion (pixels) : ring_size quand beaucoup de nutriments sont
# suivis, jusqu'à ring_size_max quand il n'y en a qu'un seul (voir ui/rings.py).
ring_size = 72
ring_size_max = 200
ring_stroke_width = 9
# Nombre maximal de lignes de cercles sur l'accueil : s'il y a plus de nutriments suivis que ce qui
# tient (3 par ligne sur un téléphone), les cercles restent sur ring_rows_max lignes et on fait
# glisser la bande vers la gauche pour voir les autres. Ainsi, le repas du jour reste visible.
ring_rows_max = 2
# Cercles de l'accueil : color_todo tant que l'apport recommandé n'est pas atteint, color_done ensuite.
# Cases de l'onglet Semaine : color_low sous low_threshold %, color_todo ensuite, color_done à 100 %.
low_threshold = 50
color_low = "#E53935"        # apport bas (rouge)
color_todo = "#FB8C00"       # en cours (orange)
color_done = "#43A047"       # apport recommandé atteint (vert)
color_custom_food = "#EF6C00" # aliments personnalisés dans les suggestions (orange)
# Nutriments à limiter (goal = "max") : color_limit tant que le maximum n'est pas dépassé, color_low au-delà.
color_limit = "#00897B"      # sous le maximum (bleu-vert)
color_info = "#78909C"       # nutriment sans repère : on affiche seulement la quantité (gris-bleu)

# Détail d'un cercle (on touche un cercle de l'accueil) : une couleur par aliment, dans cet ordre,
# du plus gros apport au plus petit. Au-delà, les plus petits apports sont regroupés en
# « Autres aliments », en chart_color_other. Ordre choisi pour que deux couleurs voisines restent
# distinguables, y compris pour les personnes daltoniennes : à garder si tu en changes une.
chart_colors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7"]
chart_color_other = "#a8a7a1"

# Calendrier de l'onglet Semaine : comportement du glissement.
swipe_switch_fraction = 0.25 # part de la largeur à faire glisser (à la souris) pour changer de semaine
swipe_switch_speed = 400     # pixels/seconde : un geste rapide change de semaine même s'il est court
swipe_snap_ms = 250          # durée (ms) du calage sur une semaine entière quand on relâche
week_arrow_ms = 350          # durée (ms) du glissement quand on utilise les flèches

# Onglet Comparer : les barres sont en % de l'apport recommandé, sur une échelle commune à tous
# les nutriments, qui s'adapte aux aliments comparés (barre pleine = 25, 50 ou 100 %...).
# compare_scale_max la plafonne : à 100, une barre pleine veut dire « le besoin du jour est
# couvert », et un aliment qui apporte davantage a une barre pleine suivie d'un chevron (le
# pourcentage exact reste écrit à droite). Tu peux monter à 150, 200, 300... : un trait vertical
# marque alors 100 %, mais un aliment très riche (ex. foie et vitamine B12) écrase les autres barres.
compare_scale_max = 100

[foods_build]
# Réglages de build_foods.py (conversion de la table Ciqual xlsx -> foods.csv)
required_group = "Minéraux"  # on écarte les aliments sans aucune valeur pour ce groupe ("" = aucun filtre)
below_limit_factor = 0.0     # "< 0,25" devient 0,25 x ce facteur (0 = zéro, 0.5 = moitié, 1 = la limite)
traces_value = 0.0           # valeur utilisée pour "traces"

# ----------------------------------------------------------------------------
#  Unités familières par défaut (menu « Unité » de la page principale) : elles ne sont
#  PAS ici mais dans config/unites_par_defaut.csv (une ligne par aliment Ciqual, éditable
#  dans un tableur). Voir le README, « Unités par défaut ».
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
#  Groupes de nutriments (facultatif) : la phrase et l'icône affichées dans le profil.
#  Le nom entre guillemets doit être exactement le « group » des nutriments plus bas.
#  icon : nom d'une icône Material de Flet (ft.Icons.XXX), voir https://flet.dev/docs/controls/icon
# ----------------------------------------------------------------------------

[groups."Minéraux"]
description = "Fer, calcium, magnésium... : les carences les plus courantes."
icon = "DIAMOND_OUTLINED"

[groups."Vitamines"]
description = "Vitamines A, D, E, K, C, B9 et B12."
icon = "WB_SUNNY_OUTLINED"

[groups."Macronutriments et eau"]
description = "Les grands apports de la journée : protéines, glucides, lipides, fibres et eau."
icon = "BOLT"

[groups."Glucides en détail"]
description = "Sucres et amidon, sucre par sucre : utile en cas d'intolérance (lactose, fructose...)."
icon = "COOKIE_OUTLINED"

[groups."À surveiller"]
description = "Sel, alcool et cholestérol : plutôt à limiter qu'à atteindre."
icon = "VISIBILITY_OUTLINED"

# ----------------------------------------------------------------------------
#  Nutriments suivis (l'ordre ici = l'ordre des cercles et des cases du profil)
#
#    label, unit, group : affichage
#    csv_column         : colonne correspondante dans foods.csv
#    ciqual             : (build_foods.py) expressions régulières sur l'en-tête Ciqual, essayées
#                         dans l'ordre ; une sous-liste = valeurs additionnées (ex. D2 + D3)
#    goal               : sens du repère. "min" (défaut) = apport à atteindre ;
#                         "max" = maximum à ne pas dépasser (sel, sucres, alcool...).
#
#  Trois sortes de nutriments, selon leur repère :
#    - à atteindre : un bloc [nutrients.<clé>.reference], sans « goal » ;
#    - à limiter   : un bloc reference + goal = "max" ;
#    - sans repère : pas de bloc reference (ni goal). L'app affiche alors seulement la
#                    quantité du jour, sans pourcentage (ex. fructose, cholestérol).
#
#  Références [nutrients.<clé>.reference] :
#    homme                      : tranches d'âge [[âge_max_inclus, valeur], ...]
#                                 (la dernière tranche doit aller au moins jusqu'à age_max)
#    femme                      : idem — sert pour une femme NON RÉGLÉE, et de valeur de repli
#    femme_regles               : idem — femme réglée (facultatif)
#    femme_regles_abondantes    : idem — femme abondamment réglée (facultatif)
#    grossesse, allaitement     : valeur unique (facultatif)
#
#  Situation choisie dans le profil -> clé utilisée (la première définie pour ce nutriment) :
#    non réglée            : femme
#    réglée                : femme_regles, sinon femme
#    abondamment réglée    : femme_regles_abondantes, sinon femme_regles, sinon femme
#    enceinte              : grossesse, sinon femme
#    allaitement           : allaitement, sinon femme
#  Un homme utilise toujours « homme ».
#
#  Pour ajouter un nutriment : colonne dans foods.csv + un bloc ci-dessous. Rien à toucher
#  dans le code : cases du profil et cercles se créent tout seuls.
# ----------------------------------------------------------------------------

