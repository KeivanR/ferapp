# --- Macronutriments et eau -------------------------------------------------
#  Protéines, glucides, lipides : les besoins réels dépendent du poids et de la dépense
#  d'énergie, que le profil ne connaît pas. Les valeurs ci-dessous sont des repères moyens :
#    - adultes : apports de référence de l'étiquetage (règlement UE 1169/2011, adulte-type à
#      2000 kcal : glucides 260 g, lipides 70 g) ; protéines : 0,83 g/kg/j (EFSA/ANSES) pour un
#      poids moyen (env. 60 kg pour une femme, 70 kg pour un homme) ;
#    - enfants : mêmes repères réduits selon l'âge (ordres de grandeur).
#  Fibres : 30 g/j pour un adulte (ANSES). Eau : apport total, boissons ET aliments (EFSA).

[nutrients.proteines]
label = "Protéines"
unit = "g"
group = "Macronutriments et eau"
csv_column = "proteines_g"
ciqual = ['^Protéines, N x facteur de Jones', '^Protéines, N x 6\.25']
[nutrients.proteines.reference]
homme = [[3, 13], [6, 18], [10, 30], [14, 45], [17, 57], [200, 58]]
femme = [[3, 13], [6, 18], [10, 30], [14, 44], [17, 48], [200, 50]]
grossesse = 60
allaitement = 67

