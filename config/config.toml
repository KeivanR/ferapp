# --- À surveiller -----------------------------------------------------------
#  Sel : moins de 5 g/j pour un adulte (OMS) ; moins pour un enfant (ordres de grandeur).
#  Alcool : repère français « maximum 2 verres par jour, et pas tous les jours » (1 verre
#  standard = 10 g d'alcool pur) ; zéro pour les mineurs, pendant la grossesse et l'allaitement.
#  Cholestérol : plus de limite officielle aujourd'hui, donc sans repère. Pour revenir à
#  l'ancien repère de 300 mg/j, ajoute  goal = "max"  et un bloc reference à 300.

[nutrients.sel]
label = "Sel"
unit = "g"
group = "À surveiller"
csv_column = "sel_g"
ciqual = ['^Sel chlorure de sodium']
goal = "max"
[nutrients.sel.reference]
homme = [[3, 2], [6, 3], [200, 5]]
femme = [[3, 2], [6, 3], [200, 5]]

[nutrients.alcool]
label = "Alcool"
unit = "g"
group = "À surveiller"
csv_column = "alcool_g"
ciqual = ['^Alcool']
goal = "max"
[nutrients.alcool.reference]
